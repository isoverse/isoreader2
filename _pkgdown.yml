title: isoreader2
url: https://isoreader2.isoverse.org
template:
  bootstrap: 5
  bootswatch: litera
  bslib:
    base_font: {google: "Inter"}
    heading_font: {google: "Plus Jakarta Sans"}
    code_font: {google: "JetBrains Mono"}

development:
  mode: auto

navbar:
  title: isoreader2
  type: default
  left:
  - text: Quick Start
    href: index.html#show-me-some-code
  - text: Functionality Guide
    href: articles/functionality_guide.html
  - text: Reference
    href: reference/index.html
  right:
  - icon: fa-github fa-lg
    href: https://github.com/isoverse/isoreader2
    aria-label: View on GitHub

reference:
- title: Read isofiles
  desc: >
    These functions allows reading of stable isotope data files/archives
  contents:
  - ir_examples_folder
  - ir_copy_examples
  - ir_find_isofiles
  - ir_find_continuous_flow
  - ir_find_dual_inlet
  - ir_find_scans
  - ir_read_isofiles
  - c.ir_isofiles
  - ir_check_isoextract
  - ir_check_isosolfs
  - ir_extract_isofiles
  - ir_get_isoextract_version
  - ir_get_supported_file_types
  - ir_get_problems
  
- title: Aggregate isofiles data
  desc: >
    These functions combine the data from multiple isofiles for combined use
  contents:
  - ir_aggregate_isofiles
  - c.ir_aggregated_data
  - ir_convert_intensity
  - ir_start_aggregator
  - ir_add_to_aggregator
  - ir_register_aggregator
  - ir_get_aggregator
  - ir_get_data

  
- title: Metadata operations
  desc: >
    These functions filter, modify, or extend the metadata of aggregated isofiles.
  contents:
  - ir_metadata
  - ir_filter_for

- title: Visualize isofiles data
  desc: >
    These functions plot aggregated isofiles data.
  contents:
  - ir_default_theme
  - ir_plot_scans
  - ir_plot_continuous_flow
  - ir_plot_dual_inlet

- title: Export & storage
  desc: >
    These functions save aggregated isofiles data to disk.
  contents:
  - ir_export_to_excel
  - ir_storage
  - ir_isofiles_storage

- title: Package options
  desc: >
    These functions are available to simplify or customize the data analysis.
  contents:
  - isoreader2-package
  - ir_options
  - ir_get_options
  - ir_get_option
